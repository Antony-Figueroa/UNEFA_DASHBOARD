services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unefa-frontend
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - ./.env:/app/.env:ro
    environment:
      - VITE_API_URL=http://localhost:3000/api
      - VITE_PROXY_TARGET=http://backend:3000
      - PORT=5173
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "sh", "/app/test-env-readonly.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - unefa-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unefa-backend
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
      - ./backend/.env:/app/.env:ro
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "npm", "run", "test:env"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - unefa-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

networks:
  unefa-network:
    driver: bridge
