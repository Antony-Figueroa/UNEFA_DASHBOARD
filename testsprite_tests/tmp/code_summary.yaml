version: "2"
type: frontend
tech_stack:
  - React 19
  - TypeScript 5.7
  - Vite 6
  - Tailwind CSS v4
  - React Router 7
  - React Hook Form + Zod
  - Axios
  - Supabase (PostgreSQL)
  - ApexCharts
  - FullCalendar
  - Framer Motion
routes:
  - path: /
    file: src/pages/Dashboard/Home.tsx
    auth_required: true
    description: Dashboard principal
  - path: /students
    file: src/pages/Students/students.tsx
    auth_required: true
    description: Gestión de estudiantes
  - path: /tutors
    file: src/pages/Tutors/tutors.tsx
    auth_required: true
    description: Gestión de tutores
  - path: /institutions
    file: src/pages/Institutions/institutions.tsx
    auth_required: true
    description: Gestión de instituciones
  - path: /pre-enrollment
    file: src/pages/PreEnrollment/PreEnrollment.tsx
    auth_required: true
    description: Pre-inscripciones
  - path: /enrollment
    file: src/pages/Enrollment/Enrollment.tsx
    auth_required: true
    description: Inscripciones
  - path: /tracking
    file: src/pages/Tracking/Tracking.tsx
    auth_required: true
    description: Seguimiento de prácticas
  - path: /culmination
    file: src/pages/Culmination/Culmination.tsx
    auth_required: true
    description: Culminación de prácticas
  - path: /tutor/dashboard
    file: src/pages/Tutor/TutorDashboard.tsx
    auth_required: true
    description: Panel de tutor
  - path: /tutor/students
    file: src/pages/Tutor/TutorStudents.tsx
    auth_required: true
    description: Estudiantes del tutor
  - path: /tutor/tracking
    file: src/pages/Tutor/TutorTracking.tsx
    auth_required: true
    description: Seguimiento tutor
  - path: /student/dashboard
    file: src/pages/Student/StudentDashboard.tsx
    auth_required: true
    description: Panel de estudiante
  - path: /signin
    file: src/pages/AuthPages/SignIn.tsx
    auth_required: false
    description: Inicio de sesión
features:
  - name: Pre-inscripción
    description: Registro inicial de estudiantes para prácticas
    files:
      - src/pages/PreEnrollment/PreEnrollment.tsx
      - src/features/pre-enrollment/hooks/usePreEnrollment.tsx
      - src/features/pre-enrollment/components/PreEnrollmentModal.tsx
      - src/features/pre-enrollment/services/preEnrollmentService.tsx
    entry_route: /pre-enrollment
    user_interactions:
      - Click en botón "Nueva Pre-Inscripción"
      - Llenar formulario con datos del estudiante
      - Seleccionar carrera y período
      - Elegir tipo de práctica
      - Guardar pre-inscripción
      - Ver pre-inscripciones activas/inactivas
    api_calls:
      - GET /api/pre-enrollments
      - POST /api/pre-enrollments
      - PUT /api/pre-enrollments/:id
      - DELETE /api/pre-enrollments/:id
    auth_required: true
  - name: Inscripción
    description: Conversion de pre-inscripción a inscripción正式
    files:
      - src/pages/Enrollment/Enrollment.tsx
      - src/features/enrollment/hooks/useEnrollment.tsx
      - src/features/enrollment/components/EnrollmentModal.tsx
      - src/features/enrollment/services/enrollmentService.tsx
    entry_route: /enrollment
    user_interactions:
      - Click en "Nueva Inscripción" o exportar desde pre-inscripción
      - Seleccionar estudiante, institución, tutor
      - Configurar período y tipo de práctica
      - Guardar inscripción
      - Ver inscripciones activas/inactivas
    api_calls:
      - GET /api/enrollments
      - POST /api/enrollments
      - PUT /api/enrollments/:id
      - DELETE /api/enrollments
    auth_required: true
  - name: Seguimiento
    description: Registro y gestión del seguimiento de estudiantes
    files:
      - src/pages/Tracking/Tracking.tsx
      - src/features/tracking/hooks/useTracking.ts
      - src/features/tracking/components/TrackingModal.tsx
      - src/features/tracking/services/trackingService.ts
    entry_route: /tracking
    user_interactions:
      - Ver lista de seguimientos
      - Crear nuevo seguimiento
      - Editar seguimiento existente
      - Registrar visitas
      - Ver estadísticas de seguimiento
    api_calls:
      - GET /api/tracking
      - POST /api/tracking
      - PUT /api/tracking/:id
      - DELETE /api/tracking/:id
    auth_required: true
  - name: Visitas
    description: Registro de visitas del tutor a empresas
    files:
      - src/pages/Tracking/VisitRegistration.tsx
      - backend/src/controllers/visits.controller.ts
    entry_route: /tracking
    user_interactions:
      - Registrar nueva visita
      - Seleccionar estudiante/práctica
      - Registrar fecha, tipo, horas trabajadas
      - Describir actividades realizadas
      - Agregar observaciones y recomendaciones
    api_calls:
      - GET /api/visits
      - POST /api/visits
      - PUT /api/visits/:id
      - DELETE /api/visits/:id
    auth_required: true
  - name: Culminación
    description: Gestión de culminación de prácticas profesionales
    files:
      - src/pages/Culmination/Culmination.tsx
      - src/features/culmination/services/culminationService.ts
      - backend/src/controllers/culmination.controller.ts
    entry_route: /culmination
    user_interactions:
      - Ver lista de prácticas culminadas
      - Aprobar/rechazar culminación
      - Generar certificación
      - Ver estadísticas de culminación
    api_calls:
      - GET /api/culmination
    auth_required: true
  - name: Gestión de Estudiantes
    description: CRUD de estudiantes del sistema
    files:
      - src/pages/Students/students.tsx
      - src/features/students/hooks/useStudents.tsx
      - src/features/students/components/StudentModal.tsx
      - backend/src/controllers/students.controller.ts
    entry_route: /students
    user_interactions:
      - Ver lista de estudiantes
      - Crear nuevo estudiante
      - Editar datos del estudiante
      - Cambiar status (activar/inactivar)
      - Buscar por nombre o cédula
    api_calls:
      - GET /api/students
      - POST /api/students
      - PUT /api/students/:id
      - DELETE /api/students/:id
    auth_required: true
  - name: Gestión de Tutores
    description: CRUD de tutores académicos
    files:
      - src/pages/Tutors/tutors.tsx
      - src/features/tutors/hooks/useTutors.tsx
      - backend/src/controllers/tutors.controller.ts
    entry_route: /tutors
    user_interactions:
      - Ver lista de tutores
      - Crear nuevo tutor
      - Asignar carreras al tutor
      - Editar tutor
      - Cambiar status
    api_calls:
      - GET /api/tutors
      - POST /api/tutors
      - PUT /api/tutors/:id
      - DELETE /api/tutors/:id
    auth_required: true
  - name: Gestión de Instituciones
    description: CRUD de instituciones/empresas aliadas
    files:
      - src/pages/Institutions/institutions.tsx
      - src/features/institutions/hooks/useInstitutions.tsx
      - backend/src/controllers/institutions.controller.ts
    entry_route: /institutions
    user_interactions:
      - Ver lista de instituciones
      - Crear nueva institución
      - Agregar responsables institucionales
      - Editar detalles
      - Desactivar/activar institución
    api_calls:
      - GET /api/institutions
      - POST /api/institutions
      - PUT /api/institutions/:id
      - DELETE /api/institutions/:id
    auth_required: true
known_limitations: []